<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global News Briefing</title>
  
  <!-- Tailwind CSS & Typography Plugin -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          },
          colors: {
            paper: '#fdfbf7', // 따뜻한 종이 질감의 아이보리 배경
            ink: '#2c2a29',   // 완전 블랙이 아닌 부드러운 먹색
            emerald: {
              700: '#047857', // 트렌디하고 차분한 에메랄드 그린 포인트
              600: '#059669',
            },
            line: '#eaddce'   // 따뜻한 베이지톤 경계선
          },
          typography: {
            DEFAULT: {
              css: {
                color: '#2c2a29',
                a: {
                  color: '#047857',
                  textDecoration: 'underline',
                  textDecorationColor: '#6ee7b7',
                  textUnderlineOffset: '4px',
                  fontWeight: '600',
                  '&:hover': {
                    color: '#022c22',
                    textDecorationColor: '#047857',
                  },
                },
                h1: { color: '#1c1917', fontWeight: '800', marginTop: '2rem' },
                h2: { color: '#1c1917', fontWeight: '800', marginTop: '1.5rem' },
                h3: { color: '#292524', fontWeight: '700' },
                hr: { borderColor: '#eaddce', marginTop: '2rem', marginBottom: '2rem' }
              },
            },
          },
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #fdfbf7; /* Paper */
      /* 한글 타이포그래피 최적화: 단어 단위 줄바꿈 */
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    
    /* 아코디언(details/summary) 커스텀 디자인 */
    details {
      background: #ffffff;
      border: 1px solid #eaddce;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }
    details:hover {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    summary {
      padding: 16px 20px;
      cursor: pointer;
      font-weight: 700;
      color: #1c1917;
      background-color: #faf9f5;
      list-style: none; /* 기본 화살표 숨김 */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: '+';
      color: #047857;
      font-size: 1.2rem;
      font-weight: 300;
      transition: transform 0.3s ease;
    }
    details[open] summary::after {
      transform: rotate(45deg); /* + 기호가 x로 변함 */
    }
    details[open] summary {
      border-bottom: 1px solid #eaddce;
    }
    details div {
      padding: 20px;
      color: #44403c;
      line-height: 1.7;
    }
  </style>
</head>
<body class="font-sans antialiased text-ink min-h-screen pb-12">

  <!-- Header Section -->
  <header class="border-b border-line">
    <div class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 pt-12 md:pt-16 pb-8 flex flex-col lg:flex-row lg:justify-between lg:items-end gap-6">
      <div>
        <p class="text-xs md:text-sm font-bold text-emerald-700 tracking-widest uppercase mb-2">Morning Report</p>
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-ink">
          Global News Briefing
        </h1>
      </div>
      
      <!-- 우측 상단: 주요 시장 지표 (Market Snapshot) -->
      <div class="flex flex-col items-start lg:items-end gap-2">
        <span id="update-time" class="text-xs text-stone-400 font-medium tracking-wide">업데이트 대기 중...</span>
        <div id="market-snapshot" class="flex flex-wrap items-center gap-3 sm:gap-5 text-sm md:text-base bg-white/60 p-4 rounded-xl border border-line shadow-sm">
        <div class="flex flex-col items-center">
          <span class="text-xs text-stone-500 font-medium mb-1">원/달러</span>
          <span class="font-bold text-ink" id="stat-fx">1,357.78</span>
        </div>
        <div class="w-px h-8 bg-line"></div>
        <div class="flex flex-col items-center">
          <span class="text-xs text-stone-500 font-medium mb-1">미 10년물</span>
          <span class="font-bold text-red-600" id="stat-us10y">4.968% <span class="text-xs">▲</span></span>
        </div>
        <div class="w-px h-8 bg-line"></div>
        <div class="flex flex-col items-center">
          <span class="text-xs text-stone-500 font-medium mb-1">CNN 공포탐욕</span>
          <span class="font-bold text-emerald-600" id="stat-fgi">45 <span class="text-xs font-normal">(Fear)</span></span>
        </div>
      </div>
      </div>
    </div>
  </header>

  <!-- Main Content Section -->
  <main class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 py-10 md:py-16 min-h-[50vh]">
    <article id="content" class="prose md:prose-lg lg:prose-2xl max-w-none prose-a:transition-colors">
      <div class="flex justify-center items-center py-20">
        <span class="text-stone-400 font-medium tracking-wide">오늘의 브리핑을 준비하고 있습니다...</span>
      </div>
    </article>
  </main>

  <!-- Footer Section -->
  <footer class="border-t border-line">
    <div class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 py-8 md:py-16 text-center text-sm md:text-base text-stone-400">
      <p>Auto-generated by <span class="font-medium text-stone-500">GitHub Actions</span> & <span class="font-medium text-stone-500">Gemini API</span></p>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      const body = document.documentElement;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').innerText = isDark ? '🌙 다크 모드' : '☀️ 라이트 모드';
    }

    // 포맷팅 헬퍼 함수
    function formatNumber(num) {
      return Number(num).toLocaleString('en-US', { maximumFractionDigits: 2 });
    }
    
    function formatChange(changePercent) {
      if (!changePercent || changePercent === 0) return `<span class="text-xs font-normal text-stone-400">(0.00%)</span>`;
      const sign = changePercent > 0 ? '+' : '';
      const colorClass = changePercent > 0 ? 'text-red-500' : 'text-blue-500';
      return `<span class="text-xs font-normal ${colorClass}">(${sign}${changePercent.toFixed(2)}%)</span>`;
    }

    // 시장 지표 불러오기
    fetch('market-data.json?t=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        if(data.fx) document.getElementById('stat-fx').innerHTML = `${formatNumber(data.fx.price)} ${formatChange(data.fx.change)}`;
        if(data.nasdaq) document.getElementById('stat-nasdaq').innerHTML = `${formatNumber(data.nasdaq.price)} ${formatChange(data.nasdaq.change)}`;
        if(data.sp500) document.getElementById('stat-sp500').innerHTML = `${formatNumber(data.sp500.price)} ${formatChange(data.sp500.change)}`;
        if(data.kospi) document.getElementById('stat-kospi').innerHTML = `${formatNumber(data.kospi.price)} ${formatChange(data.kospi.change)}`;
        if(data.us10y) document.getElementById('stat-us10y').innerHTML = `${formatNumber(data.us10y.price)}% ${formatChange(data.us10y.change)}`;
        
        let fgiText = "Neutral";
        if (data.fgi) {
           if (data.fgi.price < 35) fgiText = "Extreme Fear";
           else if (data.fgi.price < 45) fgiText = "Fear";
           else if (data.fgi.price > 75) fgiText = "Extreme Greed";
           else if (data.fgi.price > 55) fgiText = "Greed";
           document.getElementById('stat-fgi').innerHTML = `${data.fgi.price} <span class="text-xs font-normal text-stone-500">(${fgiText})</span>`;
        }

        if(data.updatedAt) {
          document.getElementById('update-time').innerText = `최근 업데이트: ${data.updatedAt}`;
        }
      })
      .catch(e => console.log('Market data not found yet.'));

    // 브리핑 불러오기
    fetch('news-summary-result.md?t=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error('아직 오늘자 브리핑이 도착하지 않았습니다.');
        return response.text();
      })
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(error => {
        document.getElementById('content').innerHTML = `
          <p class="text-red-500 font-medium text-center py-10">${error.message}</p>
        `;
      });
  </script>
</body>
</html>
