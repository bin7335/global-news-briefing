<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global News Briefing</title>
  
  <!-- Tailwind CSS & Typography Plugin -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          },
          colors: {
            paper: '#fdfbf7', // 따뜻한 종이 질감의 아이보리 배경
            ink: '#2c2a29',   // 완전 블랙이 아닌 부드러운 먹색
            emerald: {
              700: '#047857', // 트렌디하고 차분한 에메랄드 그린 포인트
              600: '#059669',
            },
            line: '#eaddce'   // 따뜻한 베이지톤 경계선
          },
          typography: {
            DEFAULT: {
              css: {
                color: '#2c2a29',
                a: {
                  color: '#047857',
                  textDecoration: 'underline',
                  textDecorationColor: '#6ee7b7',
                  textUnderlineOffset: '4px',
                  fontWeight: '600',
                  '&:hover': {
                    color: '#022c22',
                    textDecorationColor: '#047857',
                  },
                },
                h1: { color: '#1c1917', fontWeight: '800', marginTop: '2rem' },
                h2: { color: '#1c1917', fontWeight: '800', marginTop: '1.5rem' },
                h3: { color: '#292524', fontWeight: '700' },
                hr: { borderColor: '#eaddce', marginTop: '2rem', marginBottom: '2rem' }
              },
            },
          },
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #fdfbf7; /* Paper */
      /* 한글 타이포그래피 최적화: 단어 단위 줄바꿈 */
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    #market-snapshot {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      width: 100%;
    }
    .market-item { min-width: 0; text-align: center; padding: 4px 8px; }
    .market-item + .market-item { border-left: 1px solid #eaddce; }
    .market-label { display: block; font-size: 12px; color: #78716c; white-space: nowrap; margin-bottom: 6px; }
    .market-value { display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; white-space: nowrap; }
    .market-meta { font-size: 10px; font-weight: 400; color: #78716c; white-space: normal; }
    @media (max-width: 480px) {
      .market-item { padding: 4px 2px; }
      .market-label { font-size: 10px; }
      .market-value { font-size: 13px; }
      .market-value .text-xs { font-size: 10px; }
    }
    
    /* 아코디언(details/summary) 커스텀 디자인 */
    details {
      background: #ffffff;
      border: 1px solid #eaddce;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }
    details:hover {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    summary {
      padding: 16px 20px;
      cursor: pointer;
      font-weight: 700;
      color: #1c1917;
      background-color: #faf9f5;
      list-style: none; /* 기본 화살표 숨김 */
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    summary::-webkit-details-marker {
      display: none;
    }
    summary::after {
      content: '+';
      color: #047857;
      font-size: 1.2rem;
      font-weight: 300;
      transition: transform 0.3s ease;
    }
    details[open] summary::after {
      transform: rotate(45deg); /* + 기호가 x로 변함 */
    }
    details[open] summary {
      border-bottom: 1px solid #eaddce;
    }
    details div {
      padding: 20px;
      color: #44403c;
      line-height: 1.7;
    }
  </style>
</head>
<body class="font-sans antialiased text-ink min-h-screen pb-12">

  <!-- Header Section -->
  <header class="border-b border-line">
    <div class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 pt-12 md:pt-16 pb-8 flex flex-col gap-6">
      <div>
        <p class="text-xs md:text-sm font-bold text-emerald-700 tracking-widest uppercase mb-2">Morning Report</p>
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-ink">
          Global News Briefing
        </h1>
      </div>
      
      <!-- 우측 상단: 주요 시장 지표 (Market Snapshot) -->
      <div class="flex flex-col items-start gap-2 w-full">
        <span id="update-time" class="text-xs text-stone-400 font-medium tracking-wide">업데이트 대기 중...</span>
        <div id="market-snapshot" class="text-sm md:text-base bg-white/60 py-4 px-1 md:px-4 rounded-xl border border-line shadow-sm">
        <div class="market-item">
          <span class="market-label">원/달러</span>
          <span class="market-value" id="stat-fx">--</span>
        </div>
        <div class="market-item">
          <span class="market-label">미 10년물</span>
          <span class="market-value" id="stat-us10y">--</span>
        </div>
        <div class="market-item">
          <span class="market-label">한 10년물</span>
          <span class="market-value" id="stat-kr10y">--</span>
        </div>
        <div class="market-item">
          <span class="market-label">일 10년물</span>
          <span class="market-value" id="stat-jp10y">--</span>
        </div>
        <div class="market-item">
          <span class="market-label">CNN 공포탐욕</span>
          <span class="market-value" id="stat-fgi">--</span>
        </div>
      </div>
      </div>
    </div>
  </header>

  <!-- Main Content Section -->
  <main class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 py-10 md:py-16 min-h-[50vh]">
    <p id="briefing-status" role="status" class="text-sm text-stone-500 mb-6">브리핑 날짜 확인 중...</p>
    <article id="content" class="prose md:prose-lg lg:prose-2xl max-w-none prose-a:transition-colors">
      <div class="flex justify-center items-center py-20">
        <span class="text-stone-400 font-medium tracking-wide">오늘의 브리핑을 준비하고 있습니다...</span>
      </div>
    </article>
  </main>

  <!-- Footer Section -->
  <footer class="border-t border-line">
    <div class="max-w-3xl lg:max-w-7xl mx-auto px-5 md:px-12 py-8 md:py-16 text-center text-sm md:text-base text-stone-400">
      <p>Auto-generated by <span class="font-medium text-stone-500">GitHub Actions</span> & <span class="font-medium text-stone-500">Gemini API</span></p>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      const body = document.documentElement;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.querySelector('.theme-toggle').innerText = isDark ? '🌙 다크 모드' : '☀️ 라이트 모드';
    }

    // 포맷팅 헬퍼 함수
    function formatNumber(num, digits = 2) {
      return Number(num).toLocaleString('en-US', { maximumFractionDigits: digits });
    }
    function formatBasisPoints(value) {
      if (value == null || !Number.isFinite(value)) return '';
      return `<span class="text-xs font-normal text-stone-500">(${value > 0 ? '+' : ''}${formatNumber(value)}bp)</span>`;
    }
    function quoteAsOf(value) {
      if (!value) return '';
      let label = value;
      if (/^\d{4}-\d{2}-\d{2}T/.test(value) && Number.isFinite(Date.parse(value))) {
        label = new Date(value).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
      }
      return String(label).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    }
    
    function formatChange(changePercent) {
      if (changePercent == null || !Number.isFinite(changePercent)) return '';
      if (!changePercent || changePercent === 0) return `<span class="text-xs font-normal text-stone-400">(0.00%)</span>`;
      const sign = changePercent > 0 ? '+' : '';
      const colorClass = changePercent > 0 ? 'text-red-500' : 'text-blue-500';
      return `<span class="text-xs font-normal ${colorClass}">(${sign}${changePercent.toFixed(2)}%)</span>`;
    }

    // 시장 지표 불러오기
    fetch('market-data.json?t=' + new Date().getTime())
      .then(res => { if (!res.ok) throw new Error('시세 조회 실패'); return res.json(); })
      .then(data => {
        for (const key of ['fx', 'nasdaq', 'sp500', 'kospi', 'us10y', 'kr10y', 'jp10y', 'fgi']) {
          const element = document.getElementById('stat-' + key);
          if (!element) continue;
          const quote = data[key];
          if (quote?.price == null || !Number.isFinite(Number(quote.price))) {
            element.textContent = '--';
            continue;
          }
          const suffix = key.endsWith('10y') ? '%' : '';
          const stale = quote.stale ? ' <span class="text-xs text-stone-400">(이전 값)</span>' : '';
          const rating = { 'extreme fear': '극단적 공포', fear: '공포', neutral: '중립', greed: '탐욕', 'extreme greed': '극단적 탐욕' }[quote.rating];
          const change = key.endsWith('10y') ? formatBasisPoints(quote.changeBp) : key === 'fgi' ? (rating ? `<span class="text-xs font-normal">${rating}</span>` : '') : formatChange(quote.change);
          const asOf = quote.sourceAsOf ? `<span class="market-meta">${quoteAsOf(quote.sourceAsOf)}</span>` : '';
          element.title = `${quote.source || '시세 제공처'} · ${quote.sourceAsOf || '기준 시각 미제공'}${quote.stale ? ' · 갱신 지연' : ''}`;
          element.innerHTML = `<span>${formatNumber(quote.price, key.endsWith('10y') ? 3 : 2)}${suffix}</span>${change}${stale}${asOf}`;
        }

        if(data.updatedAt) {
          document.getElementById('update-time').innerText = `최근 업데이트: ${data.updatedAt}${data.partial ? ' · 일부 지표 갱신 지연' : ''}`;
        }
      })
      .catch(e => console.log('Market data not found yet.'));

    function briefingFreshness(text, now = new Date()) {
      const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
      const generated = text.match(/^# (\d{4}-\d{2}-\d{2}) Global News Briefing/m)?.[1];
      // The source broadcast date matters even if an older video was summarized today.
      const source = text.match(/^- 원본 영상:.*?(\d{2})\/(\d{2})/m);
      let sourceDate = generated;
      if (source && generated) {
        let year = Number(generated.slice(0, 4));
        if (source[1] === '12' && generated.slice(5, 7) === '01') year--;
        sourceDate = `${year}-${source[1]}-${source[2]}`;
      }
      return sourceDate === today ? `${sourceDate} · 오늘 브리핑` : `${sourceDate || '날짜 미확인'} · 오늘 브리핑 갱신 대기 중`;
    }

    // 브리핑 불러오기
    fetch('news-summary-result.md?t=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error('아직 오늘자 브리핑이 도착하지 않았습니다.');
        return response.text();
      })
      .then(text => {
        document.getElementById('briefing-status').textContent = briefingFreshness(text);
        document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(text));
      })
      .catch(error => {
        document.getElementById('briefing-status').textContent = '브리핑을 불러오지 못했습니다.';
        document.getElementById('content').innerHTML = `
          <p class="text-red-500 font-medium text-center py-10">${error.message}</p>
        `;
      });
  </script>
</body>
</html>
