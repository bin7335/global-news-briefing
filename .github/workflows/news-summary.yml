name: Global News Briefing

on:
  push:
    branches: [main]
    paths:
      - 'summarize-news.ts'
      - 'tests/**'
      - 'tsconfig.json'
      - 'package*.json'
      - '.github/workflows/news-summary.yml'
  schedule:
    # Monday-Friday 07:30, 07:45, 08:00 KST = Sunday-Thursday UTC.
    - cron: '30,45 22 * * 0-4'
    - cron: '0 23 * * 0-4'
    # Catch up after delayed runs or later uploads: weekdays 08:17, 09:17-12:17 KST.
    - cron: '17 23 * * 0-4'
    - cron: '17 0-3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: news-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  summarize_news:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and test
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Install yt-dlp
        run: |
          curl --fail --location --retry 3 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o "$RUNNER_TEMP/yt-dlp"
          chmod +x "$RUNNER_TEMP/yt-dlp"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare optional YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            umask 077
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIE_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
          else
            echo "No YouTube cookies: Gemini video input is available as fallback."
          fi
      - name: Collect market snapshot
        run: npx --no-install tsx summarize-news.ts --market-only
      - name: Generate briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            if npx --no-install tsx summarize-news.ts; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "Briefing failed. Retrying in 60 seconds ($attempt/3)."
              sleep 60
            fi
          done
          exit 1
      - name: Publish collected data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          for file in news-summary-result.md last_processed_videoId.txt market-data.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update: Global News Briefing"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Remove temporary cookies
        if: always()
        run: rm -f -- "$RUNNER_TEMP/youtube-cookies.txt"
