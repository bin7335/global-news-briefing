name: Global News Briefing

on:
  push:
    branches: [ main ]
  schedule:
    # 7:30 AM KST = 10:30 PM UTC
    - cron: '30 22 * * 1-5'
    # 7:45 AM KST = 10:45 PM UTC
    - cron: '45 22 * * 1-5'
    # 8:00 AM KST = 11:00 PM UTC
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  summarize_news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install yt-dlp for transcript bypass
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Install yt-dlp for transcript bypass
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run News Summary Script
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi
          for i in 1 2 3; do
            echo "=== Try $i/3 ==="
            npx tsx summarize-news.ts && break || {
              if [ $i -lt 3 ]; then
                echo "Failed. Retrying in 10 minutes..."
                sleep 600
              else
                echo "All 3 attempts failed."
                exit 1
              fi
            }
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add news-summary-result.md last_processed_videoId.txt market-data.json || true
          git commit -m "Auto-update: Global News Briefing" || echo "No changes to commit"
          git push


